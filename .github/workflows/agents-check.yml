name: agent-context

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: .claude/skills matches .agents/skills
        run: ./scripts/agents.sh check
      - name: No AI co-author trailers in PR commits
        if: github.event_name == 'pull_request'
        run: |
          if git log --format=%B "origin/${{ github.base_ref }}..HEAD" | grep -qiE '^[[:space:]]*co-authored-by:'; then
            echo "A commit in this PR has a Co-Authored-By trailer; AGENTS.md rule 8 forbids it." >&2
            exit 1
          fi
