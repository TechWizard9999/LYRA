name: agent-context

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: .claude/skills matches .agents/skills
        run: ./scripts/agents.sh check
      - name: agents.sh checker regression tests
        run: ./scripts/agents-test.sh
      - name: No Co-Authored-By trailers in PR commits (single-author commits)
        if: github.event_name == 'pull_request'
        run: |
          if git log --format=%B "origin/${{ github.base_ref }}..HEAD" | grep -qiE '^[[:space:]]*co-authored-by:'; then
            echo "A commit in this PR has a Co-Authored-By trailer; commits here are single-author (AGENTS.md rule 8 bans AI co-author trailers; this check bans all)." >&2
            exit 1
          fi

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: agents.ps1 sync/check from outside the repo
        shell: pwsh
        run: ./scripts/agents-test.ps1
