[package]
name = "lyra"
version = "0.1.0"
edition = "2021"
description = "Autonomous issue -> draft PR harness around coding-agent CLIs"
default-run = "lyra"

[lib]
name = "lyra"
path = "src/lib.rs"

[[bin]]
name = "lyra"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
maud = "0.26"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonschema = "0.26"
which = "7"
minijinja = "2"
time = { version = "0.3", features = ["formatting", "macros", "serde"] }
dirs = "6"
regex = "1"
open = "5"

[dev-dependencies]
tempfile = "3"
